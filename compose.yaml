services:
  coder-db:
    image: postgres:17.6-alpine
    container_name: coder-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CODER_PG_USER:-coder}
      POSTGRES_PASSWORD: ${CODER_PG_PASSWORD:-coder}
      POSTGRES_DB: ${CODER_PG_DB:-coder}
    volumes:
      - coder_db_data:/var/lib/postgresql/data
    networks:
      - platform-control
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${CODER_PG_USER:-coder} -d ${CODER_PG_DB:-coder}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  coder:
    image: ghcr.io/coder/coder:${CODER_VERSION:-v2.36.3}
    container_name: coder
    restart: unless-stopped
    ports:
      - "${CODER_HTTP_PORT:-7080}:7080"
    environment:
      CODER_HTTP_ADDRESS: "0.0.0.0:7080"
      CODER_PG_CONNECTION_URL: "postgresql://${CODER_PG_USER:-coder}:${CODER_PG_PASSWORD:-coder}@coder-db/${CODER_PG_DB:-coder}?sslmode=disable"
      CODER_ACCESS_URL: "${CODER_ACCESS_URL:-http://localhost:7080}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - coder_home:/home/coder
    # Grant write access to the host's docker.sock. Set DOCKER_GID to the
    # gid of the "docker" group on the host, e.g.:
    #   export DOCKER_GID=$(getent group docker | cut -d: -f3)
    group_add:
      - "${DOCKER_GID:-998}"
    networks:
      - platform-control
      - platform-workspaces
    depends_on:
      coder-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # runner-docker-proxy: Milestone M2. Gives the self-hosted GitHub Actions
  # runner Docker access WITHOUT mounting /var/run/docker.sock directly into
  # the runner container (see docs/security.md, option 3 — socket proxy).
  # Only container/image lifecycle calls needed by runner-smoke.yml are
  # allow-listed; everything else (exec, networks, volumes, swarm, etc.) is
  # denied. Not published to the host — reachable only from
  # platform-workspaces, i.e. only from containers on this private network.
  runner-docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: runner-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
      VERSION: 1
      PING: 1
      # Explicitly deny everything higher-privilege: no exec, no volumes/
      # networks/swarm/plugins/nodes management, no build.
      EXEC: 0
      VOLUMES: 0
      NETWORKS: 0
      SWARM: 0
      SYSTEM: 0
      BUILD: 0
      PLUGINS: 0
      NODES: 0
      SERVICES: 0
      TASKS: 0
      SECRETS: 0
      CONFIGS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - platform-workspaces

  # runner-health: Milestone M2. Minimal HTTP service with NO published host
  # port — reachable exclusively from other containers on
  # platform-workspaces. runner-smoke.yml calls it to prove the workflow ran
  # somewhere with access to a local-only service, not merely on a generic
  # GitHub-hosted runner.
  runner-health:
    image: nginx:1.27-alpine
    container_name: runner-health
    restart: unless-stopped
    networks:
      - platform-workspaces
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 5

  # registry: Milestone M7. Local OCI registry (CNCF Distribution) for the
  # workspace toolchain images built by `make *-workspace-build` (M3/M6).
  # Not published to the host and reachable only from
  # platform-workspaces — the "bind it only to the internal compose network
  # with no host port published" option from the CNCF deployment guide,
  # since a build/pull-capable host already sits on that Docker network.
  # Basic auth (htpasswd) is layered on top as defense in depth. An
  # authenticated registry returns 401 (not 200) from `/v2/`, so the
  # healthcheck below treats 401 as healthy too — a naive `curl -f` would
  # misreport this registry as unhealthy.
  registry:
    image: registry:3.1.1
    container_name: registry
    restart: unless-stopped
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: devenv-cloud-registry
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registry_data:/var/lib/registry
      - ./cache/registry/auth:/auth:ro
    networks:
      - platform-workspaces
    healthcheck:
      # registry:3.1.1 has no curl (busybox wget only). wget's exit code
      # doesn't distinguish "server responded 401" from other failures, so
      # grep the actual status line instead of trusting the exit code — an
      # authenticated registry returns 401 (not 200) from /v2/, and both
      # count as healthy here.
      test:
        [
          "CMD-SHELL",
          "wget -S -O- http://localhost:5000/v2/ 2>&1 | grep -qE 'HTTP/[0-9.]+ (200|401)'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # temporal-db: Milestone M8. PostgreSQL persistence + SQL-based visibility
  # for Temporal (no Elasticsearch/OpenSearch dependency), per
  # `temporalio/docker-compose`'s reference `.env` (POSTGRESQL_VERSION=16 —
  # the Temporal-supported major version pinned upstream at the time this
  # was written).
  temporal-db:
    image: postgres:16.10-alpine
    container_name: temporal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TEMPORAL_PG_USER:-temporal}
      POSTGRES_PASSWORD: ${TEMPORAL_PG_PASSWORD:-temporal}
      POSTGRES_DB: ${TEMPORAL_PG_DB:-temporal}
    volumes:
      - temporal_db_data:/var/lib/postgresql/data
    networks:
      - platform-control
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${TEMPORAL_PG_USER:-temporal} -d ${TEMPORAL_PG_DB:-temporal}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # temporal: Milestone M8. `auto-setup` runs schema setup + the server in
  # one image (fine for this single-node local stack); SQL-based visibility
  # via the same Postgres instance (DYNAMIC_CONFIG... left at server
  # defaults, which already default to SQL visibility when ES env vars are
  # absent) — no Elasticsearch/OpenSearch service, per the plan.
  temporal:
    image: temporalio/auto-setup:${TEMPORAL_VERSION:-1.29.7}
    container_name: temporal
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${TEMPORAL_PG_USER:-temporal}
      POSTGRES_PWD: ${TEMPORAL_PG_PASSWORD:-temporal}
      POSTGRES_SEEDS: temporal-db
      # NOTE: this container's OWN entrypoint (auto-setup.sh's
      # `temporal operator cluster health` namespace-registration step,
      # and the healthcheck below) uses TEMPORAL_ADDRESS/TEMPORAL_CLI_ADDRESS
      # as the `temporal` CLI's own --address default — set to 127.0.0.1
      # for that internal use. Other compose services (temporal-ui,
      # temporal-worker) have their OWN TEMPORAL_ADDRESS=temporal:7233 set
      # independently in their own service blocks and are unaffected by
      # this value.
      TEMPORAL_ADDRESS: 127.0.0.1:7233
      TEMPORAL_CLI_ADDRESS: 127.0.0.1:7233
      # M13 Observability: `auto-setup`'s config template (see
      # config_template.yaml's PROMETHEUS_ENDPOINT branch) wires this
      # straight into the server's frontend/history/matching/worker
      # `metrics.prometheus.listenAddress` - no separate collector hop
      # needed for the server's own service_requests/task-queue counters.
      # 0.0.0.0 here is the app's own listener (matching the existing
      # BIND_ON_IP pattern above), not a published host port - only
      # `prometheus` (this compose network) ever reaches it.
      PROMETHEUS_ENDPOINT: "0.0.0.0:9090"
      # `temporalio/auto-setup`'s entrypoint binds the frontend/history/
      # matching/worker gRPC services to BIND_ON_IP (defaulting to this
      # container's own hostname-resolved IP if unset) — TEMPORAL_ADDRESS
      # alone does NOT control the bind address, only the address the
      # `temporal` CLI itself defaults to. Set to 0.0.0.0 explicitly so the
      # server listens on every interface — reachable both as
      # "temporal:7233" (other compose services, via Docker DNS) and as
      # 127.0.0.1:7233 (this container's own CLI invocations/healthcheck).
      BIND_ON_IP: 0.0.0.0
    ports:
      - "${TEMPORAL_GRPC_PORT:-7233}:7233"
    networks:
      - platform-control
    depends_on:
      temporal-db:
        condition: service_healthy
    healthcheck:
      # `temporalio/auto-setup` binds its frontend gRPC service to the
      # *host part* of TEMPORAL_ADDRESS (confirmed via `netstat` inside the
      # running container). Set it to 0.0.0.0 so the server listens on
      # every interface — reachable both as "temporal:7233" (other compose
      # services, resolved via Docker DNS to this container's
      # platform-control IP) and as 127.0.0.1:7233 for this healthcheck.
      # Using the bare service hostname here was observed to hang for the
      # full gRPC dial timeout (~8s) even though the server was already
      # healthy and reachable by IP — a DNS-resolution quirk specific to
      # the `temporal` CLI's gRPC resolver in this environment, not a
      # reflection of actual server health.
      test:
        [
          "CMD",
          "temporal",
          "--address",
          "127.0.0.1:7233",
          "operator",
          "namespace",
          "describe",
          "default",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # temporal-ui: Milestone M8. Web UI for inspecting workflow/Event History.
  temporal-ui:
    image: temporalio/ui:${TEMPORAL_UI_VERSION:-2.53.3}
    container_name: temporal-ui
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: "http://localhost:${TEMPORAL_UI_PORT:-8088}"
    ports:
      - "${TEMPORAL_UI_PORT:-8088}:8080"
    networks:
      - platform-control
    depends_on:
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # temporal-worker: Milestone M8. Runs the demo durable workflow's Worker
  # (`temporal/src/demo/worker.py`) — `demo-durable-workflow` task queue,
  # shared with the starter via `temporal/src/demo/config.py`. Idempotency
  # state persisted to a named volume so it survives container
  # kill/recreate, not just in-process retries.
  #
  # Milestone M15: also runs `EmbeddedValidationWorkflow`, whose Activities
  # (`demo/e2e_activities.py`) call the M11 lab-sim MCP service directly by
  # its `platform-workspaces` service name - this worker is therefore
  # joined to that network too (previously only `platform-control`), and
  # carries the same bearer-token identity ("agent-a") the manual M11/M12
  # verification scripts use.
  temporal-worker:
    image: devenv-cloud/temporal-worker:latest
    container_name: temporal-worker
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      DEMO_TASK_QUEUE: demo-durable-workflow
      DEMO_STATE_PATH: /var/lib/demo-worker/idempotency.json
      # M13 Observability: native Prometheus metrics endpoint for this
      # worker's Temporal SDK Runtime (workflow/activity counters) - see
      # demo/config.py for why this bypasses otel-collector's OTLP path.
      # 0.0.0.0 here is the SDK's own listener (matching the `temporal`
      # service's PROMETHEUS_ENDPOINT pattern above), not a published host
      # port - only `prometheus` (this compose network) ever reaches it.
      METRICS_BIND_ADDRESS: "0.0.0.0:9091"
      LAB_SIM_URL: http://lab-sim:8300/mcp/
      LAB_SIM_AGENT_TOKEN: ${LAB_SIM_AGENT_TOKEN:-change-me-a}
    volumes:
      - temporal_worker_state:/var/lib/demo-worker
    networks:
      - platform-control
      - platform-workspaces
    depends_on:
      temporal:
        condition: service_healthy
      lab-sim:
        condition: service_healthy

  # lab-sim: Milestone M11. MCP/HTTP "Lab Simulator" service - simulated
  # ECU/BMS devices (no physical hardware), reservation lifecycle bound to
  # the authenticated caller (see mcp/lab-sim/src/lab_sim). Per the MCP
  # spec's "Local MCP Server Compromise" guidance, an HTTP-exposed MCP
  # service must require a bearer token or bind to a Unix domain socket -
  # never an open, unauthenticated TCP port. Bearer-token auth is enforced
  # by lab_sim.server.BearerAuthMiddleware regardless of network placement;
  # the host port is additionally bound to 127.0.0.1 only (defense in
  # depth, same "internal-only where possible" posture as `registry`
  # above), since the agent harness (M9's `opencode`) currently runs
  # directly on this host rather than inside a workspace container on
  # platform-workspaces.
  #
  # Milestone M12: `flash_device`/`run_test` query the `opa` service's
  # decision API (OPA_URL) before touching device state - the allow/deny
  # logic lives in governance/opa/policy/lab_authz.rego, not in this
  # container.
  lab-sim:
    image: devenv-cloud/lab-sim:latest
    container_name: lab-sim
    restart: unless-stopped
    environment:
      LAB_SIM_PORT: 8300
      LAB_SIM_TOKENS: ${LAB_SIM_TOKENS:-agent-a:change-me-a,agent-b:change-me-b}
      OPA_URL: http://opa:8181
    ports:
      - "127.0.0.1:${LAB_SIM_PORT:-8300}:8300"
    networks:
      - platform-workspaces
    depends_on:
      opa:
        condition: service_started
    healthcheck:
      # An authenticated-only endpoint returns 401 for a bare request - that
      # counts as healthy here (server is up and enforcing auth), same
      # pattern as the `registry` healthcheck above.
      test: ["CMD", "python3", "/app/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # opa: Milestone M12. Open Policy Agent decision service backing the
  # `lab.authz` policy (governance/opa/policy) - the MCP lab-server (M11)
  # queries `POST /v1/data/lab/authz/allow` before executing a privileged
  # action instead of hardcoding allow/deny logic itself. Policy bundle is
  # loaded read-only from the repo, no persistence needed. Not published to
  # the host by default (127.0.0.1-only), same defense-in-depth posture as
  # `lab-sim`/`registry` - only used by other containers on
  # platform-workspaces plus local validation scripts on this host.
  opa:
    image: openpolicyagent/opa:1.9.0
    container_name: opa
    restart: unless-stopped
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policy"]
    volumes:
      - ./governance/opa/policy:/policy:ro
    ports:
      - "127.0.0.1:${OPA_PORT:-8181}:8181"
    networks:
      - platform-workspaces
    # No `healthcheck` - openpolicyagent/opa's distroless image has no
    # shell/wget/curl to run one against (verified: /bin/sh does not
    # exist). OPA starts serving in well under a second; `service_started`
    # is sufficient for `lab-sim`'s dependency below.

  # openbao: Milestone M12. Secrets store for LLM API secrets, demo device
  # credentials, and service credentials introduced in Phases 1-3 - no
  # secret should need to appear in source code from here on. TLS is
  # mandatory on the listener (self-signed cert, generated by
  # `scripts/openbao-gen-cert.sh`, never committed - see .gitignore) per
  # OpenBao's own security model and Vault's production-hardening guide
  # (eavesdropping is explicitly in-scope of the threat model). File
  # storage backend (single-node local stack, no HA requirement). Started
  # sealed; `scripts/openbao-init.sh` performs `bao operator init`/`unseal`,
  # configures auth methods/policies, and revokes the initial root token -
  # see docs/security.md for the recorded unseal-key-share location and
  # credential-rotation log. Bound to 127.0.0.1 only, same posture as
  # `lab-sim`/`opa` above.
  openbao:
    image: openbao/openbao:2.6.2
    container_name: openbao
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      BAO_ADDR: "https://127.0.0.1:8200"
      BAO_LOCAL_CONFIG: ""
    command: ["server", "-config=/openbao/config/openbao.hcl"]
    volumes:
      - ./governance/openbao/config:/openbao/config:ro
      - ./governance/openbao/certs:/openbao/certs:ro
      - openbao_data:/openbao/data
    ports:
      - "127.0.0.1:${OPENBAO_PORT:-8200}:8200"
    networks:
      - platform-control
      - platform-workspaces
    healthcheck:
      test:
        [
          "CMD",
          "bao",
          "status",
          "-tls-skip-verify",
          "-address=https://127.0.0.1:8200",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
      # A sealed-but-reachable OpenBao makes `bao status` exit 2 (not 0) -
      # that still proves the listener/TLS is up; only a hard connection
      # failure (exit >2) should count as unhealthy. Compose only supports
      # a binary healthy/unhealthy from the command's own exit code, so
      # `bao status` alone (exit 0 once unsealed, 2 while sealed) is
      # accepted here - `scripts/openbao-init.sh` is what actually unseals.

  # keycloak: Milestone M12, OPTIONAL. Only for identity experimentation;
  # gated behind `docker compose --profile governance up` - never started
  # by `make up`'s default `docker compose up -d`. Uses `start` (not
  # `start-dev`, which Keycloak's own docs say "should be strictly avoided
  # in production... insecure defaults") and a generated
  # `KC_BOOTSTRAP_ADMIN_PASSWORD` (see .env.example), not a hardcoded
  # default. `--hostname-strict=false` + HTTP-only is acceptable here only
  # because this is a local, non-published-by-default experimentation
  # service behind an opt-in profile - not the platform's TLS-mandatory
  # governance path (that's OpenBao, above).
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: keycloak
    restart: unless-stopped
    profiles: ["governance"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      # Required at container boot - not a compose-time `:?` guard, since
      # that would break `docker compose config`/`up` for every service
      # (compose interpolates required-var guards for ALL services, even
      # ones gated behind an inactive profile). Left empty by default;
      # Keycloak itself refuses to start without a real value, which is the
      # intended fail-closed behavior for this opt-in profile.
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: "xforwarded"
    command: ["start", "--http-enabled=true"]
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8543}:8080"
    networks:
      - platform-control

  # otel-collector: Milestone M13. Single ingestion point for metrics from
  # temporal-worker (OTLP) and the Temporal server's own /metrics scrape
  # target (below) - Prometheus (not this collector) is the required
  # metrics storage backend per the plan; the collector only relays.
  # Receivers are bound to this container's own compose hostname, not
  # 0.0.0.0 (OpenTelemetry's security docs name unrestricted-interface
  # binding a tracked DoS risk, CWE-1327) - see
  # observability/otel-collector/config.yaml. No host port published; only
  # `temporal-worker`/`prometheus` on `platform-control` ever reach it.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.138.0
    container_name: otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector/config.yaml"]
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otel-collector/config.yaml:ro
    networks:
      - platform-control

  # prometheus: Milestone M13. Required metrics storage backend (Grafana
  # has no built-in ingestion/storage of its own - it only queries a
  # backend). NEVER published to the host/public network - Prometheus's
  # own security docs open with an explicit warning against this; reachable
  # only from `grafana`/`otel-collector` on `platform-control`.
  prometheus:
    image: prom/prometheus:v3.7.3
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - platform-control
      - platform-workspaces
    depends_on:
      - otel-collector

  # loki: Milestone M13. Log storage backend - added (per the plan's
  # "Loki (logs) and/or Tempo (traces)" guidance) because the Manual E2E
  # Test's cross-service timestamp correlation needs per-request log
  # lines, not just aggregate metrics. Not published to the host -
  # reachable only from `promtail` (writes) and `grafana` (queries).
  loki:
    image: grafana/loki:3.5.9
    container_name: loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    networks:
      - platform-control

  # promtail: Milestone M13. Ships every compose-managed container's
  # stdout/stderr to Loki (GitHub runner during a job, Temporal
  # worker/server, MCP lab-sim, Coder/Agent Host) so a single execution can
  # be found and timestamp-correlated across services in Grafana. Read-only
  # access to the host's Docker socket for container discovery only - no
  # exec/build/network privileges (same "minimum privilege" posture as
  # `runner-docker-proxy` above, just via a different mechanism since
  # promtail talks to the socket directly rather than through a proxy).
  promtail:
    image: grafana/promtail:3.5.9
    container_name: promtail
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/config.yaml"]
    volumes:
      - ./observability/promtail/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - platform-control
    depends_on:
      - loki

  # cadvisor: Milestone M13. Per-container uptime/running-state for every
  # service in the stack - backs the "service uptime" Minimum Dashboard
  # panel without requiring bespoke instrumentation in every service (the
  # GitHub runner in particular is ephemeral/JIT and has no app-level
  # metrics endpoint of its own). Not published to the host - scraped only
  # by `prometheus` on `platform-control`.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.2
    container_name: cadvisor
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - platform-control

  # grafana: Milestone M13. Visualization only - queries Prometheus (metrics)
  # and Loki (logs) provisioned as datasources; the Minimum Dashboard is
  # provisioned from version-controlled JSON
  # (observability/grafana/provisioning/dashboards/files/phase4.json), not
  # click-ops, per Grafana's own dashboard-as-code guidance. This is the one
  # observability service intentionally published to the host, since it is
  # the human-facing UI the Manual E2E Test (M13.1) is run against.
  grafana:
    image: grafana/grafana-oss:12.1.0
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - platform-control
    depends_on:
      - prometheus
      - loki

networks:
  platform-control:
    name: platform-control
  platform-workspaces:
    name: platform-workspaces

volumes:
