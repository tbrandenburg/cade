name: openbao-check

on:
  pull_request:
    paths:
      - "scripts/openbao*"
      - "scripts/tests/*openbao*.py"
      - "governance/openbao/config/**"
      - ".github/workflows/openbao-check.yml"
  push:
    branches: [main]
    paths:
      - "scripts/openbao*"
      - "scripts/tests/*openbao*.py"
      - "governance/openbao/config/**"
      - ".github/workflows/openbao-check.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  operator-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install check dependencies
        run: python -m pip install ruff==0.14.6
      - name: Python lint and format
        run: |
          files=(scripts/openbao_*.py scripts/tests/*openbao*.py)
          ruff check --select E,F,I,B,UP,SIM,C90 --config 'lint.mccabe.max-complexity=10' "${files[@]}"
          ruff format --check "${files[@]}"
      - name: Shell checks
        run: |
          bash -n scripts/openbao-init.sh scripts/openbao-reunseal.sh
          shellcheck scripts/openbao-init.sh scripts/openbao-reunseal.sh
      - name: Private-input regressions
        run: |
          mkdir -p /tmp/opencode
          python -m unittest discover -s scripts/tests -p test_openbao_private_input.py -v
      - name: Prepare disposable drill images
        timeout-minutes: 5
        run: |
          docker pull openbao/openbao:2.6.5
          docker pull nginx:1.27-alpine
      - name: Real TLS bootstrap and copied-storage recovery
        timeout-minutes: 8
        run: python scripts/tests/openbao_tls_e2e.py
