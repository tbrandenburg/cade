name: backends-check

on:
  pull_request:
    paths:
      - "workspace/**"
      - "coder/templates/**"
      - "scripts/backend*"
      - "scripts/template*"
      - "scripts/verify-template*"
      - "scripts/doctor-azure*"
      - "scripts/doctor_azure.py"
      - "scripts/requirements-backends.txt"
      - "scripts/requirements-template-publishing.txt"
      - "tests/**"
      - "Makefile"
      - ".github/workflows/backends-check.yml"
  push:
    branches: [main]
    paths:
      - "workspace/**"
      - "coder/templates/**"
      - "scripts/backend*"
      - "scripts/template*"
      - "scripts/verify-template*"
      - "scripts/doctor-azure*"
      - "scripts/doctor_azure.py"
      - "scripts/requirements-backends.txt"
      - "scripts/requirements-template-publishing.txt"
      - "tests/**"
      - "Makefile"
      - ".github/workflows/backends-check.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install offline-check dependencies
        run: python -m pip install -r scripts/requirements-template-publishing.txt ruff==0.14.6
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.14.5"
          terraform_wrapper: false
      - name: Backend tests
        run: python -m unittest discover -s tests -v
      - name: Backend Python lint and format
        run: |
          ruff check --select E4,E7,E9,F,C901 scripts/backend*.py scripts/backends-config.py scripts/templates_push.py scripts/template_vars.py scripts/doctor_azure.py tests
          ruff format --check scripts/backend*.py scripts/backends-config.py scripts/templates_push.py scripts/template_vars.py scripts/doctor_azure.py tests
      - name: Shell checks
        run: shellcheck scripts/doctor-azure.sh scripts/verify-template-vars.sh coder/templates/generic-linux-azure/mount-home.sh
      - name: Azure Terraform format and static validation
        run: |
          set -euo pipefail
          template="coder/templates/generic-linux-azure"
          terraform -chdir="$template" fmt -check
          terraform -chdir="$template" init -backend=false -input=false -lockfile=readonly
          terraform -chdir="$template" validate
