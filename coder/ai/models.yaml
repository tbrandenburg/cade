# Models reconciled into Coder by `make ai-bootstrap`.
# `provider` must match a `name` in providers.yaml.
models:
  - provider: openai
    model: gpt-4o-mini              # exact string sent upstream
    display_name: GPT-4o mini
    context_limit: 128000
    enabled: true

  - provider: openai
    model: gpt-4o
    display_name: GPT-4o
    context_limit: 128000
    enabled: true

  - provider: openai
    model: gpt-4.1
    display_name: GPT-4.1
    context_limit: 1047576
    enabled: true

  - provider: openai
    model: gpt-5.1-codex
    display_name: GPT-5.1 Codex
    context_limit: 400000
    enabled: true

  - provider: openai
    model: gpt-5.6-luna
    display_name: GPT-5.6 Luna
    context_limit: 1050000
    enabled: true
    default: true                   # exactly one model may set this

  - provider: openai
    model: gpt-5.6-terra
    display_name: GPT-5.6 Terra
    context_limit: 1050000
    enabled: true

  - provider: openai
    model: gpt-5.6-sol
    display_name: GPT-5.6 Sol
    context_limit: 1050000
    enabled: true
