[project]
name = "docs-server"
version = "0.1.0"
description = "M11 MCP Service 1 - Documentation. stdio transport, no network reachability."
requires-python = ">=3.11"
dependencies = ["mcp>=2.1.1,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/docs_server"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
