# Egress allowlist for in-workspace agent harnesses (opencode / pi),
# enforced by the OSS `boundary` CLI (github.com/coder/boundary).
#
# NOTE: Coder's *managed* Agent Firewall requires the AI Governance
# Add-On, which this deployment does not have (entitlement
# `boundary = not_entitled`, verified 2026-08-29). Running the OSS CLI
# directly gives us allowlist enforcement WITHOUT control-plane audit
# log streaming. That gap is intentional and documented.
#
# Kept consistent with `agent-host/srt-settings.json`'s
# `network.allowedDomains` where the two lists overlap (github.com,
# *.github.com) — srt's list additionally allows `api.github.com` and
# `copilot-proxy.githubusercontent.com` (Copilot-specific, not relevant
# here) but has no package-registry or LLM-API entries, which this
# boundary allowlist adds since it wraps the actual agent harness
# process rather than an editor extension host.
#
# UNTESTED RISK (do not assume this works): `jail_type: nsjail` uses the
# same `bwrap`/user-namespace primitives that AGENTS.md already records
# as failing for `srt` in this Docker/WSL2 environment
# (`bwrap --unshare-user` blocked by unprivileged userns restrictions).
# `boundary`'s nsjail backend has NOT been live-tested in this
# environment (no built `cade/agent-workspace:latest` image and no
# running workspace were available in this step). If nsjail fails the
# same way at E2E test time (T9), the documented fallback order is:
#   1. Retry with `jail_type: landjail` (Landlock-based, no user
#      namespace required — may work where nsjail does not).
#   2. If `landjail` also fails, document `boundary` as installed but
#      non-enforcing in this environment (same precedent as `srt`'s
#      `bwrap --unshare-user` in AGENTS.md) rather than silently
#      loosening sandbox flags or claiming enforcement that isn't real.
allowlist:
  - "domain=github.com"
  - "domain=*.github.com"
  - "domain=api.openai.com"
  - "domain=registry.npmjs.org"
  - "domain=pypi.org"
  - "domain=files.pythonhosted.org"
jail_type: nsjail
log_dir: /tmp/boundary_logs
proxy_port: 8087
log_level: warn
