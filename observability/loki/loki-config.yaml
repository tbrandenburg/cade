# M13 Observability: Loki (log storage backend) — single-node, filesystem
# storage, no external object store required for this local/demo stack.
# Not published to the host — reachable only from `promtail` (which writes)
# and `grafana` (which queries) on the internal `platform-control` network.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: false
