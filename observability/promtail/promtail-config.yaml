# M13 Observability: Promtail — ships every compose-managed container's
# stdout/stderr to Loki, tagged by container name, so the Manual E2E Test
# (M13.1) can correlate a single execution's timestamps across the GitHub
# runner, Temporal worker, MCP service, and lab simulation purely from
# their logs (metrics alone don't carry per-request log lines).
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: "stream"
