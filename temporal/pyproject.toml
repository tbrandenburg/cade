[project]
name = "demo-durable-workflow"
version = "0.1.0"
description = "M8 durable-orchestration demo (Temporal Python SDK worker + starter)"
requires-python = ">=3.11"
dependencies = ["temporalio>=1.32.0,<2", "mcp>=2.1.1,<3", "docker>=7.0.0,<8", "httpx>=0.27,<1"]

[dependency-groups]
dev = ["pytest>=8.0,<9", "pytest-asyncio>=0.24,<1", "respx>=0.21,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
